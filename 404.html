<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Legal Templates</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // This redirects to index.html, encoding the current path/query/hash
      // into a query string that index.html decodes back into history state.
      // `pathSegmentsToKeep` is 1 because this project is served from the
      // `/legal-templates/` GitHub Pages project path.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      );
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
  </body>
</html>
