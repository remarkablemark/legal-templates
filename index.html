<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="logo.svg" />
    <link rel="apple-touch-icon" href="logo.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="src/style.css" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="📜 Generate documents from legal templates"
    />
    <title>Legal Templates</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // This decodes the redirect from 404.html back into the real path
      // before the app (and its router) initializes.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            '',
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>
    <script
      src="https://unpkg.com/github-corners/dist/embed.min.js"
      data-href="https://github.com/remarkablemark/legal-templates"
      data-target="_blank"
      async
      defer
    ></script>
  </head>
  <body class="min-h-screen min-w-80 dark:bg-slate-900">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="src/main.tsx"></script>
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=%VITE_GOOGLE_ANALYTICS_ID%"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', '%VITE_GOOGLE_ANALYTICS_ID%');
    </script>
  </body>
</html>
